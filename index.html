<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cuadro AR Star Trek</title>
<script src="./aframe.min.js"></script>
<script src="./mindar-image-aframe.prod.js"></script>
<style>
  :root { --bg: #0b1020; --fg: #f4efe2; --accent: #e8b84a; --muted: #9aa3b8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  a-scene { position: fixed; inset: 0; }
  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 24px max(24px, env(safe-area-inset-right)) 24px max(24px, env(safe-area-inset-left));
    background: radial-gradient(120% 90% at 50% 0%, #1b2a55 0%, var(--bg) 70%); text-align: center; }
  .overlay h1 { margin: 0; font-size: clamp(1.5rem, 6vw, 2.2rem); letter-spacing: .02em; text-wrap: balance; }
  .overlay p { margin: 0; max-width: 32ch; line-height: 1.5; color: var(--muted); text-wrap: pretty; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 14px 30px;
    background: var(--accent); color: #1a1405; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #hint { position: fixed; z-index: 10; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom));
    text-align: center; padding: 0 24px; pointer-events: none; transition: opacity .4s; }
  #hint span { display: inline-block; background: rgba(11,16,32,.78); color: var(--fg); padding: 10px 18px; border-radius: 999px; font-size: .95rem; }
  #mute { position: fixed; z-index: 15; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
    padding: 10px 16px; font-size: .9rem; background: rgba(11,16,32,.78); color: var(--fg); }
  [hidden] { display: none !important; }
  #err { color: #ffb4a8; }
</style>
</head>
<body>

<div class="overlay" id="intro">
  <h1>Cuadro de realidad aumentada</h1>
  <p>Pulsa el botón, permite el acceso a la cámara y apunta al cuadro. La imagen cobrará vida.</p>
  <button id="start" type="button">Empezar</button>
  <p id="err" hidden></p>
</div>

<button id="mute" type="button" hidden>Silenciar</button>
<div id="hint" hidden><span>Apunta la cámara a la imagen del cuadro</span></div>

<a-scene id="scene"
  mindar-image="imageTargetSrc: ./objetivo.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 8; warmupTolerance: 3; maxTrack: 1"
  color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <video id="vid" src="./video.mp4" preload="auto" playsinline webkit-playsinline crossorigin="anonymous"></video>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-video id="screen" src="#vid" position="0 0 0.002" width="1" height="0.5625"></a-video>
  </a-entity>
</a-scene>

<script>
  const $ = (id) => document.getElementById(id);
  const scene = $("scene"), vid = $("vid"), intro = $("intro"), hint = $("hint"), mute = $("mute");
  window.__estado = { encontrado: false, perdido: 0 };

  $("start").addEventListener("click", async () => {
    $("start").disabled = true;
    try {
      // El gesto del usuario desbloquea la reproducción con sonido en iOS y Android.
      await vid.play(); vid.pause(); vid.currentTime = 0;
    } catch (e) { /* se reintenta al detectar la imagen */ }
    try {
      await scene.systems["mindar-image-system"].start();
      intro.hidden = true; hint.hidden = false; mute.hidden = false;
    } catch (e) {
      $("err").hidden = false;
      $("err").textContent = "No se pudo abrir la cámara. Revisa el permiso del navegador y que la dirección empiece por https.";
      $("start").disabled = false;
    }
  });

  const target = $("target");
  target.addEventListener("targetFound", () => {
    window.__estado.encontrado = true;
    hint.style.opacity = 0;
    if (vid.ended) vid.currentTime = 0;
    vid.play().catch(() => { vid.muted = true; vid.play(); });
  });
  target.addEventListener("targetLost", () => {
    window.__estado.perdido++;
    vid.pause();
    hint.style.opacity = 1;
  });
  mute.addEventListener("click", () => {
    vid.muted = !vid.muted;
    mute.textContent = vid.muted ? "Activar sonido" : "Silenciar";
  });
</script>
</body>
</html>
